; PegPal controller firmware. UNTESTED ON HARDWARE - see README.md.
;
; Arduino framework on ESP32. The platform is pinned to espressif32 6.9.0
; (Arduino-ESP32 core 2.0.17 / ESP-IDF 4.4). The hardware-timer and
; esp_task_wdt calls in src/pumps.cpp and src/main.cpp use the core 2.x API;
; moving to core 3.x (platform 7+/pioarduino) needs those two call sites ported.

[platformio]
default_envs = esp32dev

[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
build_flags =
    -Wall
    -Wextra
    -Wno-unused-parameter
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    bblanchon/ArduinoJson@7.2.1
    bogde/HX711@0.7.5
    256dpi/MQTT@2.5.2

[env:esp32dev]
board = esp32dev

; Bench/calibration build: the serial console runs, Wi-Fi/MQTT never start and
; no remote command can reach the pumps. See README "HX711 calibration".
[env:esp32dev-bench]
board = esp32dev
build_flags =
    ${env.build_flags}
    -DPEGPAL_BENCH_MODE=1
